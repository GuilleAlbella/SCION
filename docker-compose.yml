# SCION single-VM deploy.
#
# Brings up PostgreSQL, backend (FastAPI/uvicorn), frontend (Next.js
# standalone), and nginx (single public port). Postgres data lives on
# a named volume so rebuilds and image upgrades preserve state.
#
# Usage on the VM:
#   cp .env.example .env   &&   $EDITOR .env   # set POSTGRES_PASSWORD
#   docker compose pull
#   docker compose up -d
#
# To rebuild from source instead of pulling from GHCR:
#   docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
#
# Data migration from a previous SQLite install:
#   docker cp kalido_lite.db scion-backend:/tmp/scion_source.db
#   docker exec scion-backend python backend/tools/migrate_sqlite_to_postgres.py
#
# Environment defaults assume the GHCR images are public.

# Compose project name. Without this, Compose derives the project from
# the parent directory ("Proyecto Kalido-lite" → "proyectokalido-lite"),
# which leaks into volume / network names. Pinning to "scion" gives us
# clean, predictable identifiers regardless of where the repo lives.
name: scion

services:
  postgres:
    image: postgres:16-alpine
    container_name: scion-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: scion
      POSTGRES_DB: scion
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [default]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scion -d scion"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  backend:
    image: ${SCION_BACKEND_IMAGE:-ghcr.io/guillealbella/scion-backend:latest}
    container_name: scion-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://scion:${POSTGRES_PASSWORD}@postgres:5432/scion
      SCION_EXECUTION_MODE: docker
      SCION_BACKEND_HOST: 0.0.0.0
      SCION_BACKEND_PORT: "8000"
      DATA_REGION: ${DATA_REGION:-unset}
      # TAISA AI provider config is baked into the backend image via
      # backend/app/config/taisa_llm.yaml — no runtime env injection
      # needed. Set TAISA_API_KEY here only to override the baked key
      # for development.
      TAISA_API_KEY: ${TAISA_API_KEY:-}
      API_KEY: ${API_KEY:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - data:/data
    networks: [default]

  frontend:
    image: ${SCION_FRONTEND_IMAGE:-ghcr.io/guillealbella/scion-frontend:latest}
    container_name: scion-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      # Same-origin via nginx — see docker/nginx.conf.
      NEXT_PUBLIC_API_BASE_URL: /api/v1
      NEXT_PUBLIC_API_KEY: ${API_KEY:-}
    networks: [default]

  nginx:
    # nginx 1.29-alpine — actively rebuilt by upstream. The previous
    # pin (`1.27-alpine`) hadn't been refreshed in 12 months and had
    # accumulated 79 OS-level CVEs (3 Critical) that all evaporated
    # with this bump. Pin minor + alpine so behaviour stays
    # predictable; bump again when 1.30 stable lands.
    image: nginx:1.29-alpine
    container_name: scion-nginx
    restart: unless-stopped
    depends_on: [backend, frontend]
    ports:
      - "${SCION_PUBLIC_PORT:-80}:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
    networks: [default]

  # Watchtower removed in v1.21.4. The maintained fork
  # `beatkind/watchtower` had also gone stale (31 CVEs incl. 1
  # Critical from old Go stdlib), and the auto-update saved at most
  # ~3 s vs running `update.ps1` / `update.sh` manually. The Sidebar
  # version banner (v1.22) will surface "update available", and
  # users run the script when they're ready. This also removes the
  # docker.sock mount, which was a root-equivalent attack surface
  # we no longer need.

volumes:
  pgdata:   # postgres data directory
  data:     # persistent artefacts (file uploads, etc.)

# `default` network is implicit — Compose creates `scion_default`
# automatically. No need to declare it explicitly.

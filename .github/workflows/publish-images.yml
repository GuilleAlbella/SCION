# Build and publish SCION container images to GHCR.
#
# Triggers:
#   - Pushing a tag matching `v*` (e.g. `v1.21.0`, `v1.21.0-rc1`).
#   - Manual run via the Actions UI (workflow_dispatch) for ad-hoc rebuilds.
#
# Tags published (per image):
#   - The exact ref tag (e.g. `1.21.0`, `1.21.0-rc1`)
#   - Major.minor for stable tags (e.g. `1.21`)
#   - `latest` for stable tags (skipped on -rc/-beta/-alpha)
#
# Once the first run succeeds, head to
# https://github.com/users/GuilleAlbella/packages and switch each
# package's visibility to Public so the install.sh one-liner works
# without authentication. This is one-time per package.

name: Publish container images

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: ${{ github.repository_owner }}

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: backend
            context: .
            dockerfile: docker/backend.Dockerfile
            image: scion-backend
          - name: frontend
            context: .
            dockerfile: docker/frontend.Dockerfile
            image: scion-frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref, '-') }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max
          build-args: |
            NEXT_PUBLIC_API_URL=/api/v1
            SCION_VERSION=${{ steps.meta.outputs.version }}
